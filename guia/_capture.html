<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WheelsPe — Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Manrope, system-ui, sans-serif; }
  #stage { width: 380px; height: 760px; display: flex; align-items: center; justify-content: center; padding: 10px; }
  body.bg-dark { background: #0A0E14; }
  body.bg-light { background: #F0EEE9; }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-rent.jsx"></script>
<script type="text/babel" src="screens-carpool.jsx"></script>
<script type="text/babel" src="screens-trip.jsx"></script>
<script type="text/babel" src="screens-misc.jsx"></script>
<script type="text/babel" src="screens-social.jsx"></script>

<script type="text/babel">
const { useState } = React;

const Phone = ({ children, theme }) => (
  <div style={{
    width: 360, height: 740, borderRadius: 38,
    background: theme.bg, color: theme.text,
    border: `10px solid ${theme.mode === 'dark' ? '#0A0A0A' : '#1A1F28'}`,
    boxShadow: theme.mode === 'dark'
      ? '0 30px 80px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.04) inset'
      : '0 30px 80px rgba(10,14,20,0.20)',
    overflow: 'hidden', position: 'relative',
    fontFamily: 'Manrope, system-ui, sans-serif', fontSize: 14,
  }}>
    <div style={{
      position: 'absolute', top: 0, left: 0, right: 0, height: 32,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 22px', fontSize: 12, fontWeight: 700, color: theme.text,
      zIndex: 10, pointerEvents: 'none', letterSpacing: '-0.01em',
    }}>
      <span>9:41</span>
      <div style={{ position: 'absolute', left: '50%', top: 8, transform: 'translateX(-50%)', width: 90, height: 22, borderRadius: 999, background: theme.mode === 'dark' ? '#000' : '#1A1F28' }}/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><path d="M1 7h2v3H1zm4-2h2v5H5zm4-2h2v7H9zm4-2h1v9h-1z"/></svg>
        <svg width="22" height="10" viewBox="0 0 22 10" fill="none"><rect x="1" y="1" width="18" height="8" rx="2" stroke="currentColor" strokeWidth="1"/><rect x="3" y="3" width="14" height="4" rx="1" fill="currentColor"/><rect x="20" y="4" width="1.5" height="3" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>
    <div style={{ position: 'absolute', inset: 0, paddingTop: 32, display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>{children}</div>
    </div>
    <div style={{
      position: 'absolute', bottom: 6, left: '50%', transform: 'translateX(-50%)',
      width: 110, height: 4, borderRadius: 2, background: theme.text, opacity: 0.35, zIndex: 11,
    }}/>
  </div>
);

window.__renderScreen = (screenId, mode = 'dark', accent = 'blue') => {
  document.body.className = mode === 'dark' ? 'bg-dark' : 'bg-light';
  const theme = makeTheme(mode, accent);
  const t = I18N.es;
  const COMPS = {
    onboarding: ScreenOnboarding, kyc: ScreenKyc, home: ScreenHome,
    'rent-list': ScreenRentList, 'rent-detail': ScreenRentDetail,
    'carpool-search': ScreenCarpoolSearch, 'carpool-publish': ScreenCarpoolPublish,
    'trip-active': ScreenTripActive, payment: ScreenPayment,
    owner: ScreenOwner, safety: ScreenSafety,
    chat: ScreenChat, rewards: ScreenRewards, profile: ScreenProfile,
  };
  const Comp = COMPS[screenId];
  const role = ['owner'].includes(screenId) ? 'propietario' : 'pasajero';
  const root = ReactDOM.createRoot(document.getElementById('stage'));
  root.render(
    <Phone theme={theme}>
      <Comp theme={theme} t={t} accent={theme.accent} role={role} density="comoda" onNav={() => {}}/>
    </Phone>
  );
  return true;
};

window.__renderScreen('home', 'dark', 'blue');
</script>
</body>
</html>
